name: parallel.yml

on:
  push:

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build webapp
        run: |
          echo "Building webapp..." > webapp-log.txt
          echo "Build successful!" >> webapp-log.txt

      - name: Upload webapp build report
        uses: actions/upload-artifact@v4
        with:
          name: webapp-log
          path: webapp-log.txt

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build docs
        run: |
          echo "Generating docs..." > docs-log.txt
          echo "Docs built successfully." >> docs-log.txt

      - name: Upload docs build report
        uses: actions/upload-artifact@v4
        with:
          name: docs-log
          path: docs-log.txt

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          echo "Running tests..." > test-results.txt
          echo "Test 1 passed" >> test-results.txt
          echo "Test 2 passed" >> test-results.txt

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build (with cache)
        uses: docker/build-push-action@v5
        with:
          context: ./week_1/david/docker-network
          file: ./week_1/david/docker-network/Dockerfile
          push: false
          tags: local/image:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

