name: parallel

on:
  push:
    branches:
      - feature/work-branch

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build webapp log
        run: echo "Webapp build completed" > webapp-log.txt

      - name: Upload webapp log
        uses: actions/upload-artifact@v4
        with:
          name: webapp-log
          path: webapp-log.txt

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build docs log
        run: echo "Docs build completed" > docs-log.txt

      - name: Upload docs log
        uses: actions/upload-artifact@v4
        with:
          name: docs-log
          path: docs-log.txt

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run test results
        run: echo "Test results: All passed" > test-results.txt

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with caching
        uses: docker/build-push-action@v5
        with:
          context: ./week_1/david/docker-network
          file: ./week_1/david/docker-network/Dockerfile
          push: false
          load: false
          tags: user/image:latest

      - name: Generate dummy node report
        run: |
          for version in 14 16 18; do
            echo "Node.js Report for v$version" > node-report-$version.txt
          done

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: node-reports
          path: node-report-*.txt

  log-custom:
    uses: ./.github/actions/log-message
    with:
      message: "All jobs finished successfully."

