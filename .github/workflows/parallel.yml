name: Parallel Workflow

on:
  push:
    branches:
      - feature/work-branch

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build webapp
        run: echo "Building webapp..."

      - name: Save webapp log
        run: echo "Webapp build completed" > webapp-log.txt

      - name: Upload webapp log
        uses: actions/upload-artifact@v4
        with:
          name: webapp-log
          path: webapp-log.txt

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build docs
        run: echo "Generating docs..."

      - name: Save docs log
        run: echo "Docs generated" > docs-log.txt

      - name: Upload docs log
        uses: actions/upload-artifact@v4
        with:
          name: docs-log
          path: docs-log.txt

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: echo "Running tests..."

      - name: Save test results
        run: echo "All tests passed" > test-results.txt

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with cache
        uses: docker/build-push-action@v5
        with:
          context: ./week_1/david/docker-network
          file: ./week_1/david/docker-network/Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  log-custom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log message using custom action
        uses: ./.github/actions/log-message
        with:
          message: "All jobs triggered"

