name: Parallel CI Jobs

on:
  push:
    branches:
      - feature/work-branch

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulate webapp build
        run: echo "Building webapp..." && echo "Webapp done!" > webapp-log.txt

      - name: Upload webapp log
        uses: actions/upload-artifact@v4
        with:
          name: webapp-log
          path: webapp-log.txt

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulate docs build
        run: echo "Building docs..." && echo "Docs done!" > docs-log.txt

      - name: Upload docs log
        uses: actions/upload-artifact@v4
        with:
          name: docs-log
          path: docs-log.txt

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: echo "Running tests..." && echo "All tests passed!" > test-results.txt

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./week_1/david/docker-network
          file: ./week_1/david/docker-network/Dockerfile
          push: false
          tags: my-image:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

