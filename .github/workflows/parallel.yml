# Task 2 - parallel.yml complet cu build matrix, logging etc

name: CI Task 2 Full

on:
  push:
    branches:
      - main
      - feature/work-branch

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14, 16, 18]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Print Node version
        run: node -v

      - name: Simulate build process
        run: |
          set -x
          echo "Simulated build on Node.js ${{ matrix.node-version }}"
          mkdir -p reports && echo "Report for Node ${{ matrix.node-version }}" > reports/report-${{ matrix.node-version }}.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: node-report-${{ matrix.node-version }}
          path: reports/report-${{ matrix.node-version }}.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build
        run: |
          set -x
          docker build -f week_1/david/docker-network/Dockerfile -t my-app .

  log-custom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log custom message
        uses: ./.github/actions/log-message
        with:
          message: " Task 2 pipeline ran successfully"

