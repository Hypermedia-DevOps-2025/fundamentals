name: parallel.yml

on: push

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Webapp
        run: echo "Building webapp..." && sleep 2
      - name: Save Webapp Log
        run: echo "Webapp build log" > webapp.log
      - name: Upload Webapp Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-log
          path: webapp.log

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docs
        run: echo "Building docs..." && sleep 2
      - name: Save Docs Log
        run: echo "Docs build log" > docs.log
      - name: Upload Docs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-log
          path: docs.log

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        run: echo "Running tests..." && sleep 2
      - name: Save Test Results
        run: echo "Tests passed" > results.log
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results.log

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image with cache
        uses: docker/build-push-action@v5
        with:
          context: ./week_1/david/docker-network/
          file: ./week_1/david/docker-network/Dockerfile
          push: false
          tags: myapp:test
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      - name: Move new cache to reuse next time
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache


