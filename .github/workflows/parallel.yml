name: Parallel CI Jobs

on: [push]

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Webapp
        run: echo "Building webapp..."
      - name: Generate Webapp Report
        run: echo "Build report for webapp" > webapp-report.txt
      - name: Upload Webapp Report
        uses: actions/upload-artifact@v4
        with:
          name: webapp-report
          path: webapp-report.txt

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docs
        run: echo "Building documentation..."
      - name: Generate Docs Report
        run: echo "Build report for docs" > docs-report.txt
      - name: Upload Docs Report
        uses: actions/upload-artifact@v4
        with:
          name: docs-report
          path: docs-report.txt

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Tests
        run: echo "Running tests..."
      - name: Generate Test Results
        run: echo "Test results content" > test-results.txt
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker Layer Cache
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build Docker Image
        run: docker build -t my-image:latest ./week_1/david/docker-network/

  log-custom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Custom Logger
        uses: ./.github/actions/log-message
        with:
          message: " Reusable action a fost executată cu succes!"

