name: Test WebApp (Matrix & Logs)

on:
  push:
    branches:
      - main
      - feature/test
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base_image: [nginx:alpine, httpd:2.4]
        version: [v1, v2]

    name: Test with ${{ matrix.base_image }} - ${{ matrix.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install HTML validator (tidy)
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy

      - name: Validate HTML
        run: |
          tidy -qe ./week_1/emi/test_app/webapp/index.html

      - name: Build Docker image with matrix args
        run: |
          set -x
          docker build \
            --build-arg BASE_IMAGE=${{ matrix.base_image }} \
            --build-arg APP_VERSION=${{ matrix.version }} \
            -t test-webapp:${{ matrix.version }} \
            ./week_1/emi/test_app/webapp \
            | tee build_output.log

      - name: Run container and test with curl
        run: |
          set -x
          docker run -d --name test-webapp -p 8080:80 test-webapp:${{ matrix.version }} | tee container.log
          sleep 5
          curl -v http://localhost:8080 | tee curl_output.log

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: test-webapp:${{ matrix.version }}

      - name: Sanitize artifact name
        id: sanitize
        run: |
          SAFE_NAME=$(echo "${{ matrix.base_image }}" | sed 's/[^a-zA-Z0-9_.-]/-/g')
          echo "safe_name=${SAFE_NAME}" >> $GITHUB_OUTPUT

      - name: Upload logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-test-webapp-${{ steps.sanitize.outputs.safe_name }}-${{ matrix.version }}
          path: |
            build_output.log
            container.log
            curl_output.log
            ./week_1/emi/logs/
