name: Test WebApp

on:
  push:
    branches:
      - main
      - feature/test
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install HTML validator (tidy)
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy

      - name: Validate HTML
        run: |
          tidy -qe ./week_1/emi/test_app/webapp/index.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t test-webapp ./week_1/emi/test_app/webapp

      - name: Run container and test health
        run: |
          docker run -d --name test-webapp -p 8080:80 emiliangf/webapp:latest
          sleep 5
          curl --fail http://localhost:8080 || exit 1

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: test-webapp
