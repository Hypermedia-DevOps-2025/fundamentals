name: Build and Push Webapp Docker Image

on:
  push:
    branches:
      - main
      - feature/test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.EMI_DOCKER_USERNAME }}
          password: ${{ secrets.EMI_DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t emiliangf/webapp:latest -t emiliangf/webapp:${{ github.sha }} ./week_1/emi/test_app/webapp

      - name: Push Docker image
        run: |
          docker push emiliangf/webapp:latest
          docker push emiliangf/webapp:${{ github.sha }}
