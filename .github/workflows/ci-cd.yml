name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/IN64-65_workflows_paralel
  pull_request:
    branches:
      - main
      - feature/IN64-65_workflows_paralel

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [ "8.1-apache", "8.2-apache", "8.3-apache" ]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          set -x
          docker build \
            --build-arg BASE_IMAGE=php:${{ matrix.php-version }} \
            -t stefro22/webapp:${{ matrix.php-version }} ./week_1/robu/webapp \
            > build.log 2>&1

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.php-version }}
          path: build.log
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ sectrts.OCKER_HUB_USERNAME_ROBU }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD_ROBU }}

      - name: Push Docker image
        run: docker push stefro22/webapp:${{ matrix.php-version }}

  run-tests:
    runs-on: ubuntu-latest
    needs: build-webapp
    steps:
      - uses: actions/checkout@v4
      - name: Run PHP Unit tests
        run: |
          echo "Running PHP tests..." > test-results.log
          # Run your tests here (phpunit, etc.)
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.log

  security-scan:
    runs-on: ubuntu-latest
    needs: build-webapp
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy
      - name: Scan Docker images (ignore failures)
        run: |
          for version in 8.1-apache 8.2-apache 8.3-apache; do
            trivy image --severity HIGH,CRITICAL stefro22/webapp:$version || true
          done
