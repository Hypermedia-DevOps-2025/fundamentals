name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - workflow5.0
  pull_request:
    branches:
      - main
      - workflow5.0

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - id: set-tag
        run: echo "::set-output name=image-tag::stefro22/webapp:${{ github.sha }}"

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Build Docker image
        run: |
          docker build --cache-from=type=local,src=/tmp/.buildx-cache \
                       --cache-to=type=local,dest=/tmp/.buildx-cache-new \
                       -t ${{ steps.set-tag.outputs.image-tag }} ./week_1/robu/webapp
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Save build logs
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ./week_1/robu/webapp/build.log

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build docs
        run: |
          echo "Building documentation..." > docs-build.log
      - name: Upload docs build logs
        uses: actions/upload-artifact@v4
        with:
          name: docs-logs
          path: docs-build.log

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          echo "Running tests..." > test-results.log
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.log

  security-scan:
    runs-on: ubuntu-latest
    needs: build-webapp
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy scan
        uses: ./.github/actions/trivy-scan
        with:
          image: stefro22/webapp:latest
