name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - workflow4.0

jobs:
  html-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install tidy
        run: sudo apt-get update && sudo apt-get install -y tidy
      - name: Validate HTML
        run: find ./week_1/robu/webapp -name '*.html' -exec tidy -errors -q {} \;

  container-healthcheck:
    runs-on: ubuntu-latest
    needs: html-validation
    steps:
      - uses: actions/checkout@v3
      - name: Build container for test
        run: docker build -t test-webapp ./week_1/robu/webapp
      - name: Run container health check
        run: |
          docker run -d --rm --name test-instance -p 8080:80 test-webapp
          sleep 5
          curl -f http://localhost:8080 || (echo "Health check failed" && exit 1)
          docker stop test-instance

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Install Trivy
        run: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee /etc/apt/sources.list.d/trivy.list
        sudo apt-get update && sudo apt-get install -y trivy
      - name: Scan Docker image for vulnerabilities
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 stefro22/webapp:latest

