name: Echo name and date

on: push

jobs:
  print-name:
    runs-on: ubuntu-latest
    steps:
      - name: Print my name
        run: echo "David"

  print-date:
    runs-on: ubuntu-latest
    steps:
      - name: Print current date
        run: date

  run-html-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check HTML file exists and contains <html>
        run: |
          test -f week_1/david/docker-network/webapp/index.html
          grep "<html>" week_1/david/docker-network/webapp/index.html

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: [print-name, print-date, run-html-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/webapp:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/webapp:${{ github.sha }} \
                       week_1/david/docker-network/

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/webapp:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/webapp:${{ github.sha }}

