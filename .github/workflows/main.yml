name: Echo my name

on:
  push:
    branches:
      - main
      - feature/work-branch

jobs:
  print-name:
    runs-on: ubuntu-latest
    steps:
      - name: Echo my name
        run: echo "DavidMan27"

  print-datetime:
    runs-on: ubuntu-latest
    steps:
      - name: Show current date and time
        run: date

