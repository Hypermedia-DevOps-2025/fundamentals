name: push

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  print-name:
    runs-on: ubuntu-latest
    steps:
      - name: Print my name
        run: echo "David"

  print-date:
    runs-on: ubuntu-latest
    steps:
      - name: Print current date
        run: date

  html-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install tidy
        run: sudo apt-get install -y tidy

      - name: Validate HTML
        run: tidy -qe week_1/david/docker-network/webapp/index.html

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Trivy
        run: |
          sudo apt-get install wget apt-transport-https gnupg lsb-release -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y

      - name: Scan with Trivy
        run: trivy config week_1/david/docker-network/

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: [print-name, print-date, html-lint, security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/webapp:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/webapp:${{ github.sha }} \
                       week_1/david/docker-network/

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/webapp:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/webapp:${{ github.sha }}

