name: CI Pipeline

on: [ push , pull_request ]


jobs:
  build_webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Build webapp
        run: npm run build
      - name: Upload logs or reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_log_ci
          path: ./week_1/emi/logs
  build_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build docs
        run: npm run docs:build
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: npm test
      - name: Upload logs or reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci_logs_test
          path: ./week_1/emi/logs

