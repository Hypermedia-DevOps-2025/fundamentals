jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base_image: [nginx:1.25.2-alpine, nginx:1.24-alpine, nginx:1.23-alpine]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}-${{ matrix.base_image }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.EMI_DOCKER_USERNAME }}
          password: ${{ secrets.EMI_DOCKER_PASSWORD }}

      - name: Build and push multi-platform Docker image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg BASE_IMAGE=${{ matrix.base_image }} \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache-new \
            -t emiliangf/webapp:${{ matrix.base_image }}-latest \
            -t emiliangf/webapp:${{ matrix.base_image }}-${{ github.sha }} \
            --push \
            -f ./week_1/emi/test_app/webapp/Dockerfile \
            ./week_1/emi/test_app/webapp

      - name: Move cache to correct location
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Sanitize artifact name
        id: sanitize
        run: |
          SAFE_NAME=$(echo "${{ matrix.base_image }}" | sed 's/[^a-zA-Z0-9_.-]/-/g')
          echo "safe_name=${SAFE_NAME}" >> $GITHUB_OUTPUT

      - name: Upload logs or reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-push-build-webapp-build-${{ steps.sanitize.outputs.safe_name }}
          path: ./week_1/emi/logs/

