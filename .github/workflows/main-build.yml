name: Build and Push Multi-Arch Image

on:
  push:
    branches:
      - main
      - feature/IN55-58-61_Autoimages_test_Sepworkflows

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME_ROBU }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD_ROBU }}
      - name: Build and push multi-platform images
        uses: docker/build-push-action@v4
        with:
          context: ./week_1/robu/webapp
          file: ./week_1/robu/webapp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            stefro22/webapp:latest
            stefro22/webapp:${{ github.sha }}
