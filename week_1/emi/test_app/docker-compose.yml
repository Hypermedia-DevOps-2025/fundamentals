version: '3.8'

services:
  mariadb:
    build: ./db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - network-app
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h localhost -u${DB_USER} -p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    user: "999"
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 128M
    security_opt:
      - "no-new-privileges:true"

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    networks:
      - network-app
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    user: "999"
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 128M
    security_opt:
      - "no-new-privileges:true"

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: nginx-app
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8080:80"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - network-app
    user: "nginx"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 128M
    security_opt:
      - "no-new-privileges:true"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    ports:
      - "8082:80"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - network-app
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    security_opt:
      - "no-new-privileges:true"

volumes:
  mariadb_data:
    external: true
networks:
  network-app:

