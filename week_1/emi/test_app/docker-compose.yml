version: '3.8'

services:
  mariadb:
    image: mariadb
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: test_db
      MYSQL_USER: emi
      MYSQL_PASSWORD: 1234
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - network-app

  webapp:
    build: .
    container_name: nginx-app
    ports:
      - "8080:80"
    depends_on:
      - mariadb
    networks:
      - network-app

volumes:
  mariadb_data:

networks:
  network-app:
