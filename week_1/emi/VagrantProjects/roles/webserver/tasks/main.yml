- name: Install Apache
  apt:
    name: apache2
    state: present
    update_cache: yes

- name: Install PHP and modules
  apt:
    name:
      - php
      - libapache2-mod-php
      - php-mysql
    state: present

- name: Deploy custom Apache config (optional)
  template:
    src: apache.conf.j2
    dest: "{{ apache_config_path }}"
  notify: Restart apache2

- name: Enable and start Apache
  service:
    name: apache2
    state: started
    enabled: yes

- name: Deploy sample PHP app
  template:
    src: index.php.j2
    dest: /var/www/html/index.php
    owner: www-data
    group: www-data
    mode: '0644'
  notify: Restart apache2
