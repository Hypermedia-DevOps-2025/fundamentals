name: Team Workflow

on:
  push:
    branches:
      - main
      - workflows

jobs:
  stefan:
    runs-on: ubuntu-latest
    steps:
      - name: Echo Stefan's name
        run: echo "My name is Stefan Robu "

  emi:
    runs-on: ubuntu-latest
    steps:
      - name: Echo Emi's name
        run: echo "Hello from Emi "

  david:
    runs-on: ubuntu-latest
    steps:
      - name: Echo David's name
        run: echo "Hi, I'm David "

 docker_build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./week_1/robu/webapp
          file: ./week_1/robu/webapp/Dockerfile
          push: true
          tags: |
            stefro22/webapp:latest
            stefro22/webapp:${{ github.sha }}